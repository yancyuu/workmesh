[package]
name = "workmesh"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Terminal-first task attention ledger for work across projects, machines and AI agents"
license = "Apache-2.0"
repository = "https://github.com/yancyuu/workmesh"
keywords = ["tasks", "ai", "agents", "attention", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
agent-client-protocol = { version = "5.3", features = ["process", "stdio"] }
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
hex = "0.4"
rand = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
