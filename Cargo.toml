[package]
name = "workmesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Local-first P2P workspace mesh for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/yancyuu/workmesh"
keywords = ["git", "ai", "p2p", "local-first", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
ignore = "0.4"
iroh = "1.4.1"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
